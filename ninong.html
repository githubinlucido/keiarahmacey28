<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keiarah Macey - Our Ninongs</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Baskerville', serif;
            /* Sophisticated masculine gradient: Deep Navy to Soft Teal/Cream */
            background: linear-gradient(-45deg, #0a0c1e, #16222a, #2c3e50, #1a2a6c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Masculine Glowing Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 1;
            opacity: 0.4;
            animation: orbFloat 25s infinite alternate ease-in-out;
        }
        .orb-1 { width: 500px; height: 500px; background: #2c3e50; top: -15%; left: -10%; }
        .orb-2 { width: 400px; height: 400px; background: #b2945e; bottom: -10%; right: -5%; animation-delay: -7s; } /* Gold accent */
        .orb-3 { width: 300px; height: 300px; background: #1a2a6c; top: 30%; right: -10%; animation-delay: -12s; }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(120px, -60px) scale(1.2); }
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            perspective: 1200px;
        }

        .svg-wrapper {
            max-width: 90%;
            max-height: 85%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatCard 7s infinite ease-in-out;
            /* Stronger, deeper shadow for a bold look */
            filter: drop-shadow(0 25px 60px rgba(0, 0, 0, 0.6));
        }

        .ninong-svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            animation: entry 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes floatCard {
            0%, 100% { transform: rotateY(-3deg) rotateX(1deg) translateY(0); }
            50% { transform: rotateY(3deg) rotateX(-1deg) translateY(-15px); }
        }

        @keyframes entry {
            from { opacity: 0; transform: scale(0.95) translateY(40px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .back-btn {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            color: #b2945e; /* Changes to Gold on hover */
            transform: scale(1.1) translateX(5px);
            border-color: #b2945e;
        }

        #dustCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <canvas id="dustCanvas"></canvas>

    <a href="home.html" class="back-btn">← Back to Invitation</a>

    <div class="container">
        <div class="svg-wrapper">
            <img src="ninongs.svg" alt="Ninongs" class="ninong-svg">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('dustCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.color = Math.random() > 0.5 ? '#b2945e' : '#ffffff'; // Gold or White
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
