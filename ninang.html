<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keiarah Macey - Our Ninangs</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Baskerville', serif;
            /* Animated gradient background */
            background: linear-gradient(-45deg, #fff5f7, #ffe4e9, #ffffff, #fff0f3);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animated Glowing Orbs for the "Sides" */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.5;
            animation: orbFloat 20s infinite alternate ease-in-out;
        }
        .orb-1 { width: 400px; height: 400px; background: #ffb7c5; top: -10%; left: -10%; }
        .orb-2 { width: 350px; height: 350px; background: #f8c8dc; bottom: -5%; right: -5%; animation-delay: -5s; }
        .orb-3 { width: 300px; height: 300px; background: #fff5ba; top: 20%; right: -10%; animation-delay: -10s; }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.1); }
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            perspective: 1000px; /* Enables 3D sway */
        }

        .svg-wrapper {
            max-width: 90%;
            max-height: 85%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* The "Floating Card" Animation */
            animation: floatCard 6s infinite ease-in-out;
            filter: drop-shadow(0 20px 50px rgba(255, 143, 163, 0.4));
        }

        .ninang-svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            animation: entry 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes floatCard {
            0%, 100% { transform: rotateY(-2deg) rotateX(2deg) translateY(0); }
            50% { transform: rotateY(2deg) rotateX(-2deg) translateY(-20px); }
        }

        @keyframes entry {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .back-btn {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            color: #ff8fa3;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(255, 143, 163, 0.2);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .back-btn:hover {
            background: #ff8fa3;
            color: white;
            transform: scale(1.1) translateX(5px);
            box-shadow: 0 12px 40px rgba(255, 143, 163, 0.4);
        }

        #petalCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <canvas id="petalCanvas"></canvas>

    <a href="Home.html" class="back-btn">← Back to Invitation</a>

    <div class="container">
        <div class="svg-wrapper">
            <img src="ninangs.svg" alt="Ninangs" class="ninang-svg">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('petalCanvas');
        const ctx = canvas.getContext('2d');
        let petals = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Petal {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = Math.random() * 7 + 4;
                this.speed = Math.random() * 0.8 + 0.5;
                this.wind = Math.random() * 1.5 - 0.75;
                this.rotation = Math.random() * 360;
                this.rSpeed = Math.random() * 2 - 1;
                this.opacity = Math.random() * 0.4 + 0.2;
            }
            update() {
                this.y += this.speed;
                this.x += this.wind;
                this.rotation += this.rSpeed;
                if (this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#ffb7c5';
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size / 1.8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 35; i++) petals.push(new Petal());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
