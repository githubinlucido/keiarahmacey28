<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Keiarah Macey</title>
    <style>
        :root {
            --accent: #ff8fa3;
            --soft-pink: #fce4ec;
            --text: #5d4037;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Baskerville', serif;
            /* Using your original wallpaper background */
            background: linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)), url('Wallpaper.svg') center/cover no-repeat fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .rsvp-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 40px;
            border-radius: 30px;
            width: 95%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUp 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        h1 { color: var(--accent); font-size: 2.2rem; margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; }
        p { color: var(--text); font-size: 0.95rem; margin-bottom: 30px; line-height: 1.5; }

        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text); font-size: 0.85rem; font-weight: bold; padding-left: 5px; }

        input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 143, 163, 0.3);
            background: rgba(255, 255, 255, 0.8);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(255, 143, 163, 0.2); background: #fff; }

        .radio-group { display: flex; gap: 20px; margin-top: 10px; }
        .radio-option { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text); font-size: 0.9rem; }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.4s;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(255, 143, 163, 0.3);
        }

        .submit-btn:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }
        .submit-btn:hover:not(:disabled) { background: #ff748c; transform: translateY(-3px); }

        #successMessage {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: rgba(76, 175, 80, 0.1);
            color: #2e7d32;
            border-radius: 12px;
            font-weight: bold;
        }

        .back-link { display: inline-block; margin-top: 20px; color: var(--text); text-decoration: none; font-size: 0.85rem; opacity: 0.7; transition: 0.3s; }
        .back-link:hover { opacity: 1; color: var(--accent); }
    </style>
</head>
<body>

    <div class="rsvp-card">
        <h1>RSVP</h1>
        <p>Kindly respond by May 20th.<br>We can't wait to celebrate with you!</p>

        <form id="rsvpForm">
            <div class="form-group">
                <label for="name">FULL NAME</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>WILL YOU BE ATTENDING?</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="attendance" value="yes" required> Joyfully Accepts
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="attendance" value="no"> Regretfully Declines
                    </label>
                </div>
            </div>

            

            <div class="form-group">
                <label for="message">MESSAGE</label>
                <textarea id="message" name="message" rows="3" placeholder="Anything we should know?"></textarea>
            </div>
<div class="form-group">
                <label>Note: Your invitation includes one(1) reserved seat. </label>
                
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">SEND RESPONSE</button>
        </form>

        <div id="successMessage">✨ Success! Your response has been recorded.</div>

        <a href="Home.html" class="back-link">← Back to Invitation</a>
    </div>

    
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxGAdPiRaxOW45GJkxt9MLZQqaQhmcYVlutOslROrE3KUQsrYkTEILK9FznZap1Dmce/exec'
        const form = document.getElementById('rsvpForm')
        const btn = document.getElementById('submitBtn')
        const successMsg = document.getElementById('successMessage')

        form.addEventListener('submit', e => {
            e.preventDefault()
            btn.disabled = true
            btn.innerHTML = "Sending..."
            
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                btn.innerHTML = "Sent!"
                successMsg.style.display = 'block'
                form.style.display = 'none' // Hide form on success
                console.log('Success!', response)
            })
            .catch(error => {
                btn.disabled = false
                btn.innerHTML = "Try Again"
                alert("Something went wrong. Please check your internet and try again.")
                console.error('Error!', error.message)
            })
        })
    </script>
</body>
</html>
